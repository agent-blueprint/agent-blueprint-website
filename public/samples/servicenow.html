<meta charset="utf-8">
<title>Larkspur Agent Blueprints</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an overview of every agent as a small drawing, and one full sheet per agent. Inputs enter left, changes leave right, value gauge on top, what it can't do sits below. */
:root {
  --bg: #E7EDF4;
  --paper: #F7FAFD;
  --grid: rgba(29, 79, 145, .06);
  --grid-major: rgba(29, 79, 145, .11);
  --ink: #1D4F91;
  --ink-faint: rgba(29, 79, 145, .16);
  --text: #12233A;
  --muted: #5A6B82;
  --change: #C2410C;
  --gate: #8F5A06;
  --gate-bg: #FFF3D9;
  --alert: #B42318;
  --alert-bg: #FDECEA;
  --good: #2F7D4F;
  --good-bg: #E6F4EC;
  --shadow: 0 1px 2px rgba(18, 35, 58, .06), 0 12px 32px rgba(18, 35, 58, .08);
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081525;
    --paper: #0E2138;
    --grid: rgba(169, 203, 255, .05);
    --grid-major: rgba(169, 203, 255, .09);
    --ink: #A9CBFF;
    --ink-faint: rgba(169, 203, 255, .18);
    --text: #E6EEF8;
    --muted: #93A6BF;
    --change: #FF8F5E;
    --gate: #F2C14E;
    --gate-bg: #29343B;
    --alert: #FF8A80;
    --alert-bg: rgba(255, 138, 128, .12);
    --good: #74D39C;
    --good-bg: rgba(116, 211, 156, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081525;
  --paper: #0E2138;
  --grid: rgba(169, 203, 255, .05);
  --grid-major: rgba(169, 203, 255, .09);
  --ink: #A9CBFF;
  --ink-faint: rgba(169, 203, 255, .18);
  --text: #E6EEF8;
  --muted: #93A6BF;
  --change: #FF8F5E;
  --gate: #F2C14E;
  --gate-bg: #29343B;
  --alert: #FF8A80;
  --alert-bg: rgba(255, 138, 128, .12);
  --good: #74D39C;
  --good-bg: rgba(116, 211, 156, .12);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 20px;
}
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Header */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 24px;
}
.top-main { min-width: 0; display: grid; gap: 4px; }
.eyebrow {
  font-family: var(--display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink);
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(32px, 5vw, 46px);
  line-height: 1.05;
  text-wrap: balance;
}
.job { margin: 4px 0 0; max-width: 62ch; font-size: 17px; }
.mock {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  border: 1px dashed var(--ink-faint);
  border-radius: 4px;
  padding: 6px 10px;
  white-space: nowrap;
}
.back {
  justify-self: start;
  font: 600 14px var(--body);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--ink-faint);
  border-radius: 4px;
  padding: 6px 12px 6px 10px;
  cursor: pointer;
}
.back:hover { background: var(--ink-faint); }
.top-side { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.theme-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 13px var(--body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--ink-faint);
  border-radius: 999px;
  padding: 5px 12px 5px 10px;
  cursor: pointer;
}
.theme-btn:hover { border-color: var(--ink); }
.theme-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.back:focus-visible, .card:focus-visible, .reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Overview */
.totals {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--paper);
  border: 1px solid var(--ink-faint);
  border-radius: 6px;
}
.total { padding: 16px 20px; display: grid; gap: 2px; min-width: 0; }
.total + .total { border-left: 1px solid var(--ink-faint); }
.total-v { font: 700 32px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.total-k { font-size: 13.5px; color: var(--muted); }
.attention {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 14px 18px;
  list-style: none;
  border-radius: 6px;
  background: var(--alert-bg);
  color: var(--text);
  font-size: 15px;
}
.attention b { color: var(--alert); font-weight: 600; }
.verdict { display: grid; justify-items: start; gap: 14px; padding: 22px 24px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; box-shadow: var(--shadow); }
.verdict-t { margin: 0; max-width: 62ch; font: 600 clamp(21px, 2.6vw, 28px)/1.25 var(--display); text-wrap: pretty; }
.primary { font: 600 14px var(--body); color: var(--paper); background: var(--ink); border: 1px solid var(--ink); border-radius: 4px; padding: 8px 14px; cursor: pointer; }
.primary:hover { opacity: .88; }
.primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bars, .fin { display: grid; gap: 12px; padding: 18px 20px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; min-width: 0; }
.bars-head, .group-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h2 { margin: 0; font: 700 22px/1.15 var(--display); }
.group-n { font-size: 13.5px; color: var(--muted); }
.bar-row { display: grid; grid-template-columns: 200px minmax(0, 1fr) 90px; align-items: center; gap: 12px; }
.bar-k { font-size: 14px; }
.bar-track { position: relative; height: 18px; background: var(--ink-faint); border-radius: 3px; }
.bar-fill { height: 100%; background: var(--ink); border-radius: 3px; }
.bar-fill.over { background: var(--alert); }
.bar-fill.good { background: var(--good); }
.bar-pool { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--text); }
.bar-v { font: 600 14px var(--body); text-align: right; font-variant-numeric: tabular-nums; }
.bar-v.over { color: var(--alert); }
.bars-note { margin: 0; font-size: 13.5px; color: var(--muted); }
.invest { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.invest-card { display: flex; gap: 14px; padding: 16px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; box-shadow: var(--shadow); min-width: 0; }
.invest-ico { flex: none; width: 44px; height: 44px; }
.invest-body { min-width: 0; display: grid; justify-items: start; align-content: start; gap: 5px; }
.invest-kind { font: 600 12px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.invest-text { margin: 0; font-size: 14px; }
.decision-group { display: grid; gap: 12px; min-width: 0; }
.cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.two .card { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr auto auto; column-gap: 16px; }
.cards.two .card > :not(.mini) { grid-column: 1; }
.cards.two .card .mini { grid-column: 2; grid-row: 1 / 5; align-self: center; border: none; }
.cards.two .card-job { min-height: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; min-width: 0; }
.tile-arc { flex: none; width: 56px; height: auto; }
.tile-arc .arc-bg, .tile-arc .arc-v { stroke-width: 6; }
.tile-body { min-width: 0; display: grid; gap: 2px; }
.tile-name { font: 700 17px/1.15 var(--display); }
.tile-meta { font-size: 12.5px; color: var(--muted); }
.tile-meta b { color: var(--text); font-weight: 600; }
.card.static { cursor: default; }
.card.static:hover { transform: none; border-color: var(--ink-faint); }
.ban { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; font-size: 15px; }
.ban-t { min-width: 0; flex: 1 1 280px; }
.fin-scroll { overflow-x: auto; }
.fin-table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.fin-table th { font: 600 12.5px var(--body); color: var(--muted); text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--ink-faint); }
.fin-table td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--ink-faint); }
.fin-table th:first-child, .fin-table td:first-child { text-align: left; padding-left: 0; }
.fin-total td { font-weight: 600; border-bottom: none; }
.sure { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14.5px; }
.sure b { font-weight: 600; color: var(--ink); }
.mini .arc-bg.wide, .mini .arc-v.wide { stroke-width: 14; }
.t-gauge.small { font-size: 38px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card {
  display: grid;
  grid-template-rows: auto auto auto 1fr auto;
  gap: 10px;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--paper);
  border: 1px solid var(--ink-faint);
  border-radius: 6px;
  padding: 16px 16px 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .15s, border-color .15s;
}
.card:hover { transform: translateY(-2px); border-color: var(--ink); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-name { font: 700 22px/1.1 var(--display); }
.card-job { margin: 0; font-size: 14px; color: var(--text); min-height: 63px; }
.chip {
  flex: none;
  font: 600 11.5px var(--body);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.chip.ok { color: var(--good); background: var(--good-bg); }
.chip.bad { color: var(--alert); background: var(--alert-bg); }
.chip.warn { color: var(--gate); background: var(--gate-bg); }
.mini { display: block; width: 100%; height: auto; background: var(--paper); border-top: 1px solid var(--ink-faint); border-bottom: 1px solid var(--ink-faint); }
.card-stats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 13.5px; }
.card-stats b { font: 700 18px var(--display); font-variant-numeric: tabular-nums; }
.card-stats .neg { color: var(--alert); }
.card-owner { color: var(--muted); }
.card-kind { font: 500 12px var(--mono); color: var(--muted); margin-top: -4px; }
.agent-chip { fill: var(--ink-faint); stroke: none; }
.t-chip { font: 600 11.5px var(--body); fill: var(--ink); }
.prov {
  justify-self: start;
  font: 600 12px var(--body);
  border-radius: 999px;
  padding: 2px 10px;
  color: var(--ink);
  background: var(--ink-faint);
}
.prov.read { color: var(--good); background: var(--good-bg); }
.prov.entered { color: var(--gate); background: var(--gate-bg); }

/* Sheet */
.sheet-scroll { overflow-x: auto; border-radius: 6px; box-shadow: var(--shadow); background: var(--paper); }
.sheet { display: block; width: 100%; min-width: 880px; height: auto; }

.frame-o { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.frame-i { fill: url(#grid-major); stroke: var(--ink); stroke-width: .8; }
.gl-minor { fill: none; stroke: var(--grid); stroke-width: 1; }
.gl-major { fill: none; stroke: var(--grid-major); stroke-width: 1; }

.t-head { font: 600 12px var(--display); letter-spacing: .18em; fill: var(--ink); }
.t-label { font: 500 14px var(--body); fill: var(--text); }
.t-small { font: 400 12px var(--body); fill: var(--muted); }
.t-big { font: 700 36px var(--display); fill: var(--text); }
.t-mid { font: 700 24px var(--display); fill: var(--text); }
.t-name { font: 700 22px var(--display); fill: var(--text); letter-spacing: .01em; }
.t-gauge { font: 700 44px var(--display); fill: var(--ink); }
.t-gauge.neg { fill: var(--alert); }
.t-tick { font: 500 10px var(--mono); fill: var(--muted); }
.t-gate { font: 600 12.5px var(--body); fill: var(--gate); }
.t-gate-sub { font: 500 11.5px var(--body); fill: var(--gate); }
.t-alert { font: 600 11.5px var(--body); fill: var(--alert); }
.t-tb-k { font: 500 8.5px var(--mono); letter-spacing: .12em; fill: var(--muted); }
.t-tb-v { font: 500 12px var(--mono); fill: var(--text); }
.t-tb-v.bad { fill: var(--alert); }
.t-tb-title { font: 700 14px var(--display); letter-spacing: .2em; fill: var(--ink); }

.machine { fill: var(--paper); stroke: var(--ink); stroke-width: 2.2; }
.machine-in { fill: none; stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 3 4; }
.rule { stroke: var(--ink-faint); stroke-width: 1; }
.port { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.port.change { stroke: var(--change); }
.live-dot { fill: var(--good); }

.pipe-read { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-dasharray: 6 5; }
.sheet .pipe-read { animation: flow 1.4s linear infinite; }
.pipe-change { fill: none; stroke: var(--change); stroke-width: 2.6; stroke-linecap: round; }
.pipe-change.new { stroke-dasharray: 8 6; }
.pipe-cant { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.no-sign { fill: var(--paper); stroke: var(--muted); stroke-width: 2; }
.no-slash { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.dot { fill: var(--change); }

.ring { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; transition: stroke-width .15s; }
.ring.change { stroke: var(--change); }
.ico { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico.change { stroke: var(--change); }
.ico.gate { stroke: var(--gate); }
.gate-pill { fill: var(--gate-bg); stroke: var(--gate); stroke-width: 1.6; }
.new-badge { fill: var(--alert); }
.new-mark { stroke: var(--paper); stroke-width: 1.8; stroke-linecap: round; }

.arc-bg { fill: none; stroke: var(--ink-faint); stroke-width: 16; }
.arc-v { fill: none; stroke: var(--ink); stroke-width: 16; }
.arc-v.neg { stroke: var(--alert); }
.sheet .arc-v { animation: sweep 1.1s cubic-bezier(.2, .7, .2, 1) .2s backwards; }
.mini .arc-bg, .mini .arc-v { stroke-width: 7; }
.tick { stroke: var(--ink); stroke-width: 1; }
.tick.major { stroke-width: 1.6; }
.tick.even { stroke: var(--alert); stroke-width: 2.4; }
.t-tick.even { fill: var(--alert); font-weight: 600; }
.baseline { stroke: var(--ink); stroke-width: 1.2; }

.emblem-ring { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.emblem-cell { fill: var(--ink); }

.tb-box { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
.tb-line { stroke: var(--ink); stroke-width: .8; }

.hit { cursor: pointer; outline: none; }
.hit .hl { fill: transparent; stroke: none; transition: fill .15s; }
.hit:hover .hl, .hit.on .hl { fill: var(--ink-faint); }
.hit:focus-visible .hl { fill: var(--ink-faint); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; }
.hit:hover .ring, .hit.on .ring { stroke-width: 3; }
.hit.on .t-label { fill: var(--ink); }

@keyframes flow { to { stroke-dashoffset: -22; } }
@keyframes sweep { from { stroke-dasharray: 0 100; } }

/* Detail panel */
.detail {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 24px;
  align-items: start;
  background: var(--paper);
  border: 1px solid var(--ink-faint);
  border-radius: 6px;
  padding: 18px 20px;
}
.detail-body { min-width: 0; display: grid; gap: 6px; }
.detail-k {
  font-family: var(--display);
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink);
}
.detail-t { margin: 0; font-size: 17px; max-width: 70ch; }
.detail-s { margin: 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); max-width: 90ch; }
.detail-s b { font-weight: 500; color: var(--text); }
.reset {
  font: 600 13px var(--body);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--ink-faint);
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
}
.reset:hover { background: var(--ink-faint); }

.foot { font-size: 13px; color: var(--muted); margin: 0; max-width: 80ch; }

@media (max-width: 980px) {
  .cards.two { grid-template-columns: minmax(0, 1fr); }
  .invest { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .cards { grid-template-columns: minmax(0, 1fr); }
  .cards.two .card { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .cards.two .card .mini { grid-column: 1; grid-row: auto; }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .bar-row { grid-template-columns: minmax(0, 1fr) auto; }
  .bar-track { grid-column: 1 / -1; grid-row: 2; }
  .totals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .total:nth-child(3) { border-left: none; }
  .total:nth-child(n+3) { border-top: 1px solid var(--ink-faint); }
  .detail { grid-template-columns: minmax(0, 1fr); }
  .job { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet .pipe-read, .sheet .arc-v { animation: none; }
  .card { transition: none; }
}
</style>
